apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: shivamrajdocker/test-project-backend:latest

        ports:
        - containerPort: 5000

        env:
        - name: MONGODB_URI
          value: mongodb://mongodb:27017/hellouser